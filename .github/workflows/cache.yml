name: cache

on:
  workflow_dispatch:
  schedule:
    - cron: '3 0,6,12,18 * * *'

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with:
        python-version: '3.8'
    - name: Install requirements.
      run: |-
        python -m pip install -U pip
        pip install -r requirements.txt
    - name: Fetch, cache and compress bootstrap data.
      run: python cache.py
    - name: Fetch, cache and compress live gameweek data.
      run: |-
        event_id=$(python - <<'PY'
        import json
        import lzma
        from pathlib import Path

        paths = Path('cache').glob('*/*/*/*.json.xz')
        bootstrap = max(
            paths,
            key=lambda path: tuple(int(part) for part in path.relative_to('cache').parts[:3]) + (int(path.name[:4]),)
        )
        with lzma.open(bootstrap, 'rt', encoding='utf-8') as f:
            data = json.load(f)

        current = next(event for event in data['events'] if event['is_current'])
        print(current['id'])
        PY
        )
        python cache.py \
          --url "https://fantasy.premierleague.com/api/event/${event_id}/live/" \
          --cache cache/live
    - name: Fetch, cache and compress fixture data.
      run: python cache.py --url https://fantasy.premierleague.com/api/fixtures/ --cache cache/fixtures
    - name: Push updated cache.
      run: |
        git config user.name "Automated"
        git config user.email "actions@users.noreply.github.com"
        git add -A
        timestamp=$(date -u)
        git commit -m "Updated cache @ ${timestamp}" || exit 0
        git push
